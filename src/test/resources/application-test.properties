# Test profile — overrides the root ./application.properties (profile-specific
# properties win over non-profile ones, no matter the location).

# HSQLDB in-memory datasource
spring.datasource.url=jdbc:hsqldb:mem:testdb;sql.syntax_pgs=true
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=hizzly
spring.datasource.password=123123
spring.datasource.hikari.connection-test-query=SELECT 1 FROM INFORMATION_SCHEMA.SYSTEM_USERS

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.HSQLDialect
spring.jpa.show-sql=false

# Dummy Stripe keys — context can start, but no real Stripe calls are made
stripe.secret=sk_test_dummy
stripe.publishable=pk_test_dummy
stripe.webhook.secret=whsec_test_dummy

# Blank Discord webhooks so tests never post to real channels
discord.webhook.ads=
discord.webhook.bids=
discord.webhook.comments=
discord.webhook.users=
discord.webhook.wallet=
discord.webhook.stripe=
